name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NET_MERGE_VERSION: v0.3.6 # bump to ship a newer net-merge

permissions:
  contents: write # attach the zip to tag releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: net-merge/net-merge
          ref: ${{ env.NET_MERGE_VERSION }}
          path: net-merge-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: net-merge-src/go.mod
          cache-dependency-path: net-merge-src/go.sum

      - name: Build net-merge (static, amd64)
        working-directory: net-merge-src
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${NET_MERGE_VERSION#v}" -o ../bin/net-merge ./cmd/net-merge
          cp LICENSE ../bin/net-merge.LICENSE
          cp THIRD-PARTY-NOTICES.md ../bin/

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python3 tests/test_main.py

      - name: Package
        run: |
          d=out/decky-net-merge
          mkdir -p $d
          cp -r dist bin main.py plugin.json package.json LICENSE README.md $d/
          (cd out && zip -r decky-net-merge.zip decky-net-merge)

      - uses: actions/upload-artifact@v4
        with:
          name: decky-net-merge
          path: out/decky-net-merge.zip

      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/decky-net-merge.zip --generate-notes
